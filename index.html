    <!-- ============================================================
         Tipografia própria do X369life (decisão do Isaac, 16/08/2026):
         identidade distinta do restante do ecossistema, que usa Inter.
         · Bricolage Grotesque — títulos. Grotesca contemporânea com
           caráter, sem virar "fonte de startup".
         · Public Sans — corpo e interface. É a face do design system
           do governo dos EUA: aterrissa o produto no vocabulário de
           contratação pública, e é desenhada para legibilidade densa.
         · IBM Plex Mono — rótulos, números e evidências. Vernáculo de
           documentação técnica, com algarismos tabulares.
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
