<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0A1A2F"/>
  <!-- malha de 3x3 pontos: a diagonal acesa em ambar, o resto em azul.
       É a modernização de um parque de iluminação, reduzida a nove pontos. -->
  <g>
    <circle cx="9"  cy="9"  r="2.4" fill="#E0A93C"/>
    <circle cx="16" cy="9"  r="2.4" fill="#1B5A96"/>
    <circle cx="23" cy="9"  r="2.4" fill="#1B5A96"/>
    <circle cx="9"  cy="16" r="2.4" fill="#1B5A96"/>
    <circle cx="16" cy="16" r="2.4" fill="#E0A93C"/>
    <circle cx="23" cy="16" r="2.4" fill="#1B5A96"/>
    <circle cx="9"  cy="23" r="2.4" fill="#1B5A96"/>
    <circle cx="16" cy="23" r="2.4" fill="#1B5A96"/>
    <circle cx="23" cy="23" r="2.4" fill="#E0A93C"/>
  </g>
</svg>
